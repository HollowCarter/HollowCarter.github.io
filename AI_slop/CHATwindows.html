<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resizable & Collapsible Draggable Windows</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f0f0f0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #buttonPanel {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    #buttonPanel button {
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .window {
      position: absolute;
      display: flex;
      flex-direction: column;
      width: 300px;
      height: 200px;
      min-width: 150px;
      min-height: 50px;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      user-select: none;
      overflow: hidden;
      touch-action: none;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      background: #007acc;
      color: white;
      cursor: grab;
      flex: none;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      touch-action: none;
    }

    .controls {
      display: flex;
      gap: 4px;
    }

    .controls button {
      background: transparent;
      border: none;
      color: white;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 2px;
      padding: 0;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .content {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      bottom: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.2);
      cursor: se-resize;
      touch-action: none;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div id="buttonPanel">
    <a href="../index.html"><button>back to landing page</button></a>
    <button id="addWindowBtn">Add Window</button>

    <button class="openTemplateBtn" data-title="Info"
      data-content="<p style='margin:16px;'>This is an informational window.</p>" data-width="350" data-height="200">
      Open Info Window
    </button>
    <button class="openTemplateBtn" data-title="Alert"
      data-content="<p style='margin:16px;'><strong>Alert!</strong> Something happened.</p>" data-width="350"
      data-height="200">
      Open Alert Window
    </button>
    <button class="openTemplateBtn" data-title="Nomicon" data-url=".\index.html" data-width="300" data-height="200">
      Open Google
    </button>
  </div>

  <script>
    let windowCount = 0;
    let topZ = 1;

    function makeDraggable(el) {
      const title = el.querySelector(".titlebar");
      let isDragging = false;
      let startX, startY, origX, origY;
      el.addEventListener("pointerdown", () => {
        topZ++;
        el.style.zIndex = topZ;
      });
      title.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        e.preventDefault();
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = el.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        title.setPointerCapture(e.pointerId);
      });
      title.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        el.style.left = origX + dx + "px";
        el.style.top = origY + dy + "px";
      });
      title.addEventListener("pointerup", (e) => {
        isDragging = false;
        title.releasePointerCapture(e.pointerId);
      });
    }

    function makeResizable(el) {
      const handle = document.createElement("div");
      handle.className = "resize-handle";
      el.appendChild(handle);
      let isResizing = false;
      let startX, startY, startW, startH;
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        isResizing = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = el.getBoundingClientRect();
        startW = rect.width;
        startH = rect.height;
        handle.setPointerCapture(e.pointerId);
      });
      handle.addEventListener("pointermove", (e) => {
        if (!isResizing) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        el.style.width = Math.max(startW + dx, 150) + "px";
        el.style.height = Math.max(startH + dy, 50) + "px";
      });
      handle.addEventListener("pointerup", (e) => {
        isResizing = false;
        handle.releasePointerCapture(e.pointerId);
      });
    }

    function addControls(win) {
      const collapseBtn = win.querySelector(".collapse-btn");
      const closeBtn = win.querySelector(".close-btn");
      const content = win.querySelector(".content");
      collapseBtn.addEventListener("click", () => {
        if (!win.dataset.expanded) {
          win.dataset.expanded = "true";
          win.dataset.prevHeight = win.style.height;
          const titleH = win
            .querySelector(".titlebar")
            .getBoundingClientRect().height;
          win.style.height = titleH + "px";
          content.style.display = "none";
          collapseBtn.textContent = "▢";
        } else {
          delete win.dataset.expanded;
          win.style.height = win.dataset.prevHeight;
          content.style.display = "";
          collapseBtn.textContent = "_";
        }
      });
      closeBtn.addEventListener("click", () => win.remove());
    }

    function createWindow(
      titleText,
      data,
      isURL = false,
      width = 300,
      height = 200
    ) {
      windowCount++;
      topZ++;
      const win = document.createElement("div");
      win.className = "window";
      win.id = "win" + windowCount;
      win.style.zIndex = topZ;
      win.style.width = width + "px";
      win.style.height = height + "px";
      win.style.top = 100 + "px";
      win.style.left = 100 + "px";
      const contentMarkup = isURL ? `<iframe src="${data}"></iframe>` : data;
      win.innerHTML = `
        <div class="titlebar">
          <span>${titleText}</span>
          <div class="controls">
            <button class="collapse-btn">_</button>
            <button class="close-btn">×</button>
          </div>
        </div>
        <div class="content">
          ${contentMarkup}
        </div>
      `;
      document.body.appendChild(win);
      makeDraggable(win);
      makeResizable(win);
      addControls(win);
    }

    document.getElementById("addWindowBtn").addEventListener("click", () => {
      createWindow(
        `Window ${windowCount + 1}`,
        `<p style='margin:16px;'>Draggable window #${windowCount + 1}</p>`
      );
    });
    document.querySelectorAll(".openTemplateBtn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const title = btn.getAttribute("data-title");
        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const w = parseInt(btn.getAttribute("data-width")) || 300;
        const h = parseInt(btn.getAttribute("data-height")) || 200;
        if (url) createWindow(title, url, true, w, h);
        else createWindow(title, content, false, w, h);
      });
    });

    // initial window
    createWindow(
      "Window 1",
      `<p style='margin:16px;'>This is a draggable window. Drag the title bar!</p>`,
      false,
      300,
      200
    );
  </script>
</body>

</html>
